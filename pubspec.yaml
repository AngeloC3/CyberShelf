name: cybershelf
description: "A media collection manager."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.34.2
  sqlite3: ^3.5.0
  path:
  path_provider:
  http:
  flutter_riverpod:
  riverpod_annotation:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:
  drift_dev: ^2.34.5
  build_runner:
  riverpod_generator:
  flutter_launcher_icons:

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

# dart run flutter_launcher_icons:main
flutter_launcher_icons:
  android: true
  windows:
    generate: true
    icon_path: "assets/logo.png"
    icon_size: 256
  image_path: "assets/logo.png"